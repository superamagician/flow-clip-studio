{% extends "base.html" %}
{% block title %}จัดการไฟล์ดาวน์โหลด - Flow Clip Studio{% endblock %}
{% block page_title %}จัดการไฟล์ดาวน์โหลด{% endblock %}
{% block head %}
<style>
  .summary-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .summary-pill { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
                  padding: 10px 16px; font-size: 13px; }
  .summary-pill b { display: block; font-size: 18px; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; font-size: 12.5px; border-bottom: 1px solid var(--border); }
  th { background: var(--bg-alt); color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .thumb { width: 48px; height: 85px; object-fit: cover; border-radius: 6px; background: #000; display: block; }
  .btn { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel);
         font-size: 12px; cursor: pointer; text-decoration: none; color: var(--text); display: inline-block; }
  .btn-danger { color: var(--danger); border-color: var(--danger-soft); }
  .btn-danger:hover { background: var(--danger-soft); }
  .btn-accent { color: var(--accent); border-color: var(--accent-soft); }
  .btn-accent:hover { background: var(--accent-soft); }
  .missing { color: var(--danger); font-size: 11px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .actions { display: flex; gap: 6px; }
</style>
{% endblock %}
{% block content %}
  <div class="summary-bar" id="summaryBar"></div>
  <div id="tableWrap"></div>
{% endblock %}
{% block scripts %}
<script>
  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }

  async function main() {
    const res = await fetch("/api/downloads");
    const data = await res.json();
    document.getElementById("summaryBar").innerHTML = `
      <div class="summary-pill">จำนวนไฟล์<b>${data.clips.length}</b></div>
      <div class="summary-pill">พื้นที่ใช้ทั้งหมด<b>${fmtBytes(data.total_bytes)}</b></div>
    `;
    render(data.clips);
  }

  function render(clips) {
    const wrap = document.getElementById("tableWrap");
    if (!clips.length) {
      wrap.innerHTML = '<div class="empty">ยังไม่มีไฟล์ — ลองสร้างคลิปแรกที่หน้า "สร้างคลิป"</div>';
      return;
    }
    const rows = clips.map(c => `
      <tr data-id="${c.id}">
        <td>${c.thumbnail_url ? `<img class="thumb" src="${c.thumbnail_url}">` : ""}</td>
        <td>${c.category || "-"}<br><span style="color:var(--muted)">${c.segment || ""}</span></td>
        <td>${c.width || "?"}×${c.height || "?"} · ${c.duration || "?"}s</td>
        <td>${fmtBytes(c.size_bytes)}${!c.exists ? '<div class="missing">ไม่พบไฟล์จริง (เซิร์ฟเวอร์รีสตาร์ท)</div>' : ""}</td>
        <td>${(c.created_at || "").slice(0, 16)}</td>
        <td class="actions">
          ${c.exists ? `<a class="btn btn-accent" href="${c.url}" download>ดาวน์โหลด</a>` : ""}
          <button class="btn btn-danger" onclick="deleteClip(${c.id})">ลบ</button>
        </td>
      </tr>
    `).join("");
    wrap.innerHTML = `<table>
      <thead><tr><th></th><th>สินค้า/segment</th><th>สเปก</th><th>ขนาดไฟล์</th><th>วันที่สร้าง</th><th>จัดการ</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  async function deleteClip(id) {
    if (!confirm("ลบไฟล์นี้ถาวร? กู้คืนไม่ได้")) return;
    const res = await fetch(`/api/downloads/${id}`, { method: "DELETE" });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    document.querySelector(`tr[data-id="${id}"]`).remove();
    main(); // refresh summary totals
  }

  main();
</script>
{% endblock %}
