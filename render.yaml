# Render Blueprint - https://render.com/docs/blueprint-spec
# In Render: New -> Blueprint -> connect this GitHub repo -> it reads this file.
# You still set the secret env vars yourself in the Render dashboard (never commit them):
#   DATABASE_URL   - Supabase "Connect" button -> Transaction pooler (NOT Direct connection -
#                    the direct hostname resolves to IPv6, which Render can't reach; the pooler
#                    hostname is IPv4). Format:
#                    postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres
#   MASTER_KEY     - a Fernet key: generate locally with
#                    python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#                    (reusing an existing .master.key's content keeps existing encrypted rows readable)
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_STORAGE_BUCKET - persistent video storage.
#                    Render's own disk is wiped on every deploy, so generated clips are also
#                    uploaded to a Supabase Storage bucket (Storage -> New bucket -> Public ON).
#                    URL = your project URL, key = Settings -> API -> service_role secret (NOT anon).
#                    Bucket name defaults to "clips" if SUPABASE_STORAGE_BUCKET isn't set. Optional -
#                    if unset, the app still runs, it just loses clips again on the next deploy.
#   CLIP_RETENTION_DAYS - clips older than this are auto-deleted (local disk + Storage + DB)
#                    by a background job that runs every 6 hours. Default 30. Set to 0 to
#                    disable (keeps every clip forever - Storage/DB usage then only grows).
#   ADMIN_USERNAMES  - comma-separated usernames allowed to view /admin (platform-wide
#                    stats across all customers). Empty by default (nobody can access it).
#   ANTHROPIC_API_KEY - product-specific ad copy (hook/feature/CTA/scene) via Claude Haiku
#                    instead of generic static filler when a customer leaves those fields
#                    blank. Optional - if unset, autofill just uses the old static phrases.
services:
  - type: web
    name: flow-clip-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MASTER_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: CLIP_RETENTION_DAYS
        sync: false
      - key: ADMIN_USERNAMES
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
