# Render Blueprint - https://render.com/docs/blueprint-spec
# In Render: New -> Blueprint -> connect this GitHub repo -> it reads this file.
# You still set the secret env vars yourself in the Render dashboard (never commit them):
#   DATABASE_URL   - Supabase Project Settings -> Database -> Connection string -> URI
#   MASTER_KEY     - a Fernet key: generate locally with
#                    python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#                    (reusing an existing .master.key's content keeps existing encrypted rows readable)
services:
  - type: web
    name: flow-clip-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MASTER_KEY
        sync: false
